        function drawMulti() {
            if (state !== "idle" && state !== "result") return;

            const res = parseBigIntDetailed(multiCountInputEl.value);
            if (res.error || res.value < 1n) {
                updateMultiBtnLabel();
                return;
            }

            const n = res.value;
            if (n === 1n) {
                if (isSkipMode) quickDraw();
                else resetToIdle();
                return;
            }

            if (isSkipMode) {
                executeMultiDraw(n);
                return;
            }

            state = "multi_shaking";
            containerEl.classList.remove("effect-god", "effect-abyss");
            resultBoxEl.classList.remove("show");
            multiResultBoxEl.classList.remove("show");
            stageEl.style.display = "flex";
            cylinderWrapperEl.classList.remove("is-tilted");
            stickEl.classList.remove("is-out");
            stickNumEl.textContent = "第？番";

            const compactN = formatCompactBigInt(n);
            actionBtn.disabled = true;
            multiBtnEl.disabled = true;
            multiBtnEl.textContent = `${compactN}連 抽選中...`;
            stageHintEl.textContent = `${compactN}連おみくじを振っています...`;
            cylinderWrapperEl.classList.add("is-shaking");

            spawnSfx();
            sfxInterval = setInterval(spawnSfx, 340);

            setTimeout(() => {
                clearInterval(sfxInterval);
                sfxInterval = null;
                cylinderWrapperEl.classList.remove("is-shaking");
                executeMultiDraw(n);
            }, 850);
        }

        function executeMultiDraw(n) {
            state = "result";

            let newCount = 0;
            let godCount = 0n;
            let hasLv1 = false;
            let maxLv = 1;
            let minLv = 100;

            const grid = document.getElementById("multiGrid");
            const detailEl = document.getElementById("multiDetail");
            grid.innerHTML = "";
            detailEl.innerHTML = `<span class="multi-detail-hint">カードや平均・中央チップをタップするとお告げが読めます</span>`;

            const isAggregateMode = n > 200n;
            const displayItems = [];
            const roundCounts = {};

            if (!isAggregateMode) {
                const countNum = Number(n);
                for (let i = 0; i < countNum; i++) {
                    const selected = omikujiData[Math.floor(Math.random() * omikujiData.length)];
                    const key = String(selected.lv);
                    const prevCount = drawCounts[key] || 0n;
                    const nextCount = prevCount + 1n;
                    drawCounts[key] = nextCount;
                    roundCounts[key] = (roundCounts[key] || 0n) + 1n;

                    const isNew = prevCount === 0n;
                    const dup = nextCount - 1n;
                    if (isNew) newCount++;
                    if (selected.lv >= 95) godCount += 1n;
                    if (selected.lv === 1) hasLv1 = true;
                    if (selected.lv > maxLv) maxLv = selected.lv;
                    if (selected.lv < minLv) minLv = selected.lv;

                    displayItems.push({ item: selected, isNew, dup, gained: 1n });
                }
            } else {
                const sampledCounts = sampleMultinomial100(n);
                omikujiData.forEach((item, idx) => {
                    const gained = sampledCounts[idx];
                    if (gained <= 0n) return;

                    const key = String(item.lv);
                    const prevCount = drawCounts[key] || 0n;
                    const nextCount = prevCount + gained;
                    drawCounts[key] = nextCount;
                    roundCounts[key] = gained;

                    const isNew = prevCount === 0n;
                    const dup = nextCount - 1n;
                    if (isNew) newCount++;
                    if (item.lv >= 95) godCount += gained;
                    if (item.lv === 1) hasLv1 = true;
                    if (item.lv > maxLv) maxLv = item.lv;
                    if (item.lv < minLv) minLv = item.lv;

                    displayItems.push({ item, isNew, dup, gained });
                });
            }

            saveCollection();

            const roundStats = calcStats(roundCounts);

            stageEl.style.display = "none";
            resultBoxEl.classList.remove("show");
            multiResultBoxEl.classList.add("show");
            containerEl.classList.remove("effect-god", "effect-abyss");

            if (godCount > 0n) {
                containerEl.classList.add("effect-god");
            } else if (hasLv1 && !isAggregateMode) {
                void containerEl.offsetWidth;
                containerEl.classList.add("effect-abyss");
            }

            const summaryTitleEl = document.getElementById("multiSummaryTitle");
            summaryTitleEl.textContent = `${formatCompactBigInt(n)}連の結果`;
            summaryTitleEl.title = `${formatCommaBigInt(n)}連`;

            document.getElementById("multiSummaryStats").innerHTML = `
                ${newCount > 0 ? `<span class="stat-new">NEW: ${newCount}</span>` : ""}
                ${godCount > 0n ? `<span class="stat-god">神域(95+): ${formatCompactBigInt(godCount)}</span>` : ""}
                <span>最高 Lv.${maxLv} / 最低 Lv.${minLv}</span>
            `;

            const avgContainer = document.getElementById("multiSummaryAverages");
            avgContainer.innerHTML = "";
            if (roundStats) {
                const makeChip = (label, lvText, item) => {
                    const btn = document.createElement("button");
                    btn.className = "avg-chip";
                    btn.innerHTML = `
                        <span class="avg-chip-label">${label}</span>
                        <span>Lv.${lvText}</span>
                        <strong>${item.name}</strong>
                        <span style="font-size:0.65rem;color:var(--muted-color);">(${item.reading})</span>
                    `;
                    btn.addEventListener("click", () => {
                        grid.querySelectorAll(".multi-card.selected").forEach(c => c.classList.remove("selected"));
                        detailEl.innerHTML = `<div><strong>[${label} Lv.${lvText} → ${item.name}（${item.reading}）]</strong> ${item.message}</div>`;
                    });
                    return btn;
                };
                avgContainer.appendChild(makeChip("平均", roundStats.meanText, roundStats.meanItem));
                avgContainer.appendChild(makeChip("中央", roundStats.medianText, roundStats.medianItem));
            }

            displayItems.forEach(entry => {
                const { item, isNew, dup, gained } = entry;
                const card = document.createElement("div");
                let extraClass = "";
                if (item.lv >= 95) extraClass = " is-god";
                else if (item.lv <= 5) extraClass = " is-abyss";

                card.className = "multi-card" + extraClass;

                const badgeHtml = isNew && gained === 1n
                    ? `<span class="multi-badge-new">NEW</span>`
                    : `<span class="multi-badge-dup">+${formatCompactBigInt(dup)}</span>`;

                const gainedHtml = isAggregateMode
                    ? `<div class="multi-card-gained">+${formatCompactBigInt(gained)}回</div>`
                    : (isNew ? `<div class="multi-card-gained" style="color:#fde047;">初獲得!</div>` : "");

                card.innerHTML = `
                    <div class="multi-card-top">
                        <span class="multi-card-lv">Lv.${item.lv}</span>
                        ${badgeHtml}
                    </div>
                    <div class="multi-card-reading">${item.reading}</div>
                    <div class="multi-card-name">${item.name}</div>
                    <div class="zone-tag ${item.class}" style="font-size: 0.54rem; padding: 0.08rem 0.35rem; margin-top: 0.22rem;">${item.zoneShortLabel}</div>
                    ${gainedHtml}
                `;

                card.addEventListener("click", () => {
                    grid.querySelectorAll(".multi-card.selected").forEach(c => c.classList.remove("selected"));
                    card.classList.add("selected");
                    const exactGained = isAggregateMode ? `（今回 ${formatCommaBigInt(gained)}回 / 累計被り +${formatCommaBigInt(dup)}）` : "";
                    detailEl.innerHTML = `<div><strong>Lv.${item.lv} ${item.name}（${item.reading}）</strong>${exactGained}：${item.message}</div>`;
                });

                grid.appendChild(card);
            });

            grid.scrollTop = 0;
            actionBtn.disabled = false;
            updateControlLabels();
        }

        function resetToIdle() {
            state = "idle";
            containerEl.classList.remove("effect-god", "effect-abyss");
            resultBoxEl.classList.remove("show");
            multiResultBoxEl.classList.remove("show");
            stageEl.style.display = "flex";

            cylinderWrapperEl.classList.remove("is-tilted", "is-shaking");
            stickEl.classList.remove("is-out");
            stickNumEl.textContent = "第？番";
            updateControlLabels();
        }

        [actionBtn, stageEl].forEach(el => {
            el.addEventListener("pointerdown", startShaking);
            el.addEventListener("pointerup", releaseShaking);
            el.addEventListener("pointercancel", releaseShaking);
        });

        // ========== 図鑑の詳細・拡大・縮小・閉じる ==========
        function handleDexItemClick(item, el) {
            if (selectedLv === item.lv) {
                closeDexDetail();
                return;
            }
            showDexDetail(item, el);
        }

        function showDexDetail(item, el) {
            selectedLv = item.lv;
            document.querySelectorAll(".dex-item.selected").forEach(node => node.classList.remove("selected"));
            if (el) {
                el.classList.add("selected");
            } else {
                const target = document.querySelector(`.dex-item[data-lv="${item.lv}"]`);
                if (target) target.classList.add("selected");
            }

            const count = drawCounts[String(item.lv)] || 0n;
            const detailEl = document.getElementById("dexDetail");

            if (count === 0n) {
                detailEl.innerHTML = `
                    <div class="dex-detail-header">
                        <div class="dex-detail-top">
                            <span class="dex-detail-lv">第 ${item.lv} 番（Lv.${item.lv}）</span>
                            <span class="dex-detail-name">？？？</span>
                        </div>
                        <div class="dex-detail-actions">
                            <button class="btn-mini-action" onclick="expandDexDetail()">⤢ 拡大</button>
                            <button class="btn-mini-action" onclick="closeDexDetail()">✕</button>
                        </div>
                    </div>
                    <p class="dex-detail-msg" style="color: var(--muted-color);">まだ引いていません。おみくじを振って解放しよう！</p>
                `;
                return;
            }

            const dup = count - 1n;
            const dupBadge = dup > 0n
                ? `<span class="dex-dup" style="font-size: 0.72rem; padding: 0.12rem 0.45rem; max-width: none;">+${formatCompactBigInt(dup)}</span>`
                : "";
            const godClass = item.lv >= 95 ? " god-text" : "";
            const exactLine = dup >= 10000n
                ? `<div class="dex-detail-exact">正確な被り数: +${formatCommaBigInt(dup)}</div>`
                : "";

            detailEl.innerHTML = `
                <div class="dex-detail-header">
                    <div class="dex-detail-top">
                        <span class="dex-detail-lv">第 ${item.lv} 番（Lv.${item.lv}）</span>
                        <span class="dex-detail-name${godClass}">${item.name}</span>
                        <span class="dex-detail-reading">（${item.reading}）</span>
                        <span class="zone-tag ${item.class}" style="font-size: 0.68rem; padding: 0.12rem 0.55rem; margin-top: 0;">${item.zoneLabel}</span>
                        ${dupBadge}
                    </div>
                    <div class="dex-detail-actions">
                        <button class="btn-mini-action" onclick="expandDexDetail()">⤢ 拡大</button>
                        <button class="btn-mini-action" onclick="closeDexDetail()">✕</button>
                    </div>
                </div>
                <p class="dex-detail-msg">${item.message}</p>
                ${exactLine}
            `;
        }

        function expandDexDetail() {
            if (selectedLv === null) return;
            const item = omikujiByLv[selectedLv];
            if (!item) return;

            const count = drawCounts[String(item.lv)] || 0n;
            const zoomCard = document.getElementById("dexZoomCard");
            const zoomTitle = document.getElementById("dexZoomTitle");
            const zoomBody = document.getElementById("dexZoomBody");

            zoomCard.className = "dex-zoom-card";
            if (count > 0n) {
                if (item.lv >= 95) zoomCard.classList.add("is-god");
                else if (item.lv <= 5) zoomCard.classList.add("is-abyss");
            }

            zoomTitle.textContent = `第 ${item.lv} 番（Lv.${item.lv}）`;

            if (count === 0n) {
                zoomBody.innerHTML = `
                    <div class="dex-zoom-name" style="color: var(--muted-color); margin: 1rem 0;">？？？</div>
                    <p class="dex-zoom-msg" style="color: var(--muted-color);">この運勢はまだ解放されていません。<br>おみくじを引いて解放しよう！</p>
                `;
            } else {
                const dup = count - 1n;
                const dupText = dup > 0n ? `+${formatCompactBigInt(dup)}（計 ${formatCompactBigInt(count)} 回獲得）` : "初獲得（計 1 回獲得）";
                const exactDupLine = dup >= 10000n ? `<div style="margin-top:0.3rem;">正確な被り数: +${formatCommaBigInt(dup)}</div>` : "";

                zoomBody.innerHTML = `
                    <div class="dex-zoom-reading">${item.reading}</div>
                    <div class="dex-zoom-name">${item.name}</div>
                    <span class="zone-tag ${item.class}" style="margin-top: 0.7rem;">${item.zoneLabel}</span>
                    <p class="dex-zoom-msg">${item.message}</p>
                    <div class="dex-zoom-stats">
                        <div>被り数: <strong>${dupText}</strong></div>
                        ${exactDupLine}
                    </div>
                `;
            }

            const idx = currentFilteredList.findIndex(d => d.lv === selectedLv);
            document.getElementById("zoomPrevBtn").disabled = idx <= 0;
            document.getElementById("zoomNextBtn").disabled = idx === -1 || idx >= currentFilteredList.length - 1;
            document.getElementById("zoomIndexInfo").textContent = idx !== -1 ? `${idx + 1} / ${currentFilteredList.length}` : "";

            dexZoomOverlayEl.classList.add("open");
        }

        function navigateZoom(step) {
            if (selectedLv === null || currentFilteredList.length === 0) return;
            const idx = currentFilteredList.findIndex(d => d.lv === selectedLv);
            if (idx === -1) return;
            const nextIdx = idx + step;
            if (nextIdx < 0 || nextIdx >= currentFilteredList.length) return;

            const nextItem = currentFilteredList[nextIdx];
            showDexDetail(nextItem, null);
            expandDexDetail();
        }

        function shrinkDexDetail() {
            dexZoomOverlayEl.classList.remove("open");
        }

        function closeDexDetail() {
            dexZoomOverlayEl.classList.remove("open");
            selectedLv = null;
            document.querySelectorAll(".dex-item.selected").forEach(node => node.classList.remove("selected"));
            document.getElementById("dexDetail").innerHTML = `<div class="dex-detail-empty">おみくじをタップすると詳しく見られます</div>`;
        }

        function handleZoomOverlayClick(e) {
            if (e.target.id === "dexZoomOverlay") {
                shrinkDexDetail();
            }
        }

        function toggleSortOrder() {
            sortOrder = sortOrder === "desc" ? "asc" : "desc";
            dexOrderBtnEl.textContent = sortOrder === "asc" ? "a〜Z ▲" : "Z〜a ▼";
            renderDexGrid();
        }

        function resetDexFilters() {
            dexSearchEl.value = "";
            dexStatusFilterEl.value = "all";
            dexZoneFilterEl.value = "__ALL__";
            dexPrefixFilterEl.value = "__ALL__";
            dexDupMinEl.value = "";
            dexDupMaxEl.value = "";
            renderDexGrid();
        }

        function renderDexGrid() {
            const grid = document.getElementById("dexGrid");
            const matchCountEl = document.getElementById("matchCount");
            grid.innerHTML = "";

            const query = dexSearchEl.value.trim().toLowerCase();
            const statusFilter = dexStatusFilterEl.value;
            const zoneFilter = dexZoneFilterEl.value;
            const prefixFilter = dexPrefixFilterEl.value;
            const minDup = parseBigIntInput(dexDupMinEl.value);
            const maxDup = parseBigIntInput(dexDupMaxEl.value);
            const hasRange = minDup !== null || maxDup !== null;

            dexSearchEl.classList.toggle("active", query !== "");
            dexStatusFilterEl.classList.toggle("active", statusFilter !== "all");
            dexZoneFilterEl.classList.toggle("active", zoneFilter !== "__ALL__");
            dexPrefixFilterEl.classList.toggle("active", prefixFilter !== "__ALL__");
            dexDupMinEl.classList.toggle("active", minDup !== null);
            dexDupMaxEl.classList.toggle("active", maxDup !== null);

            const isFiltered = query !== "" || statusFilter !== "all" || zoneFilter !== "__ALL__" || prefixFilter !== "__ALL__" || hasRange;

            const filtered = omikujiData.filter(item => {
                const count = drawCounts[String(item.lv)] || 0n;
                const isUnlocked = count > 0n;
                const dup = count - 1n;

                if (statusFilter === "dup" && dup <= 0n) return false;
                if (statusFilter === "unlocked" && !isUnlocked) return false;
                if (statusFilter === "locked" && isUnlocked) return false;

                if (hasRange) {
                    if (!isUnlocked) return false;
                    if (minDup !== null && dup < minDup) return false;
                    if (maxDup !== null && dup > maxDup) return false;
                }

                if (zoneFilter !== "__ALL__" && item.zone !== zoneFilter) return false;
                if (prefixFilter !== "__ALL__" && item.prefix !== prefixFilter) return false;

                if (query !== "") {
                    const lvTargets = `${item.lv} lv.${item.lv} lv${item.lv} 第${item.lv}番`.toLowerCase();
                    if (isUnlocked) {
                        const unlockedTargets = `${item.name} ${item.reading} ${item.zone} ${item.zoneReading}ぞーん ${item.zoneLabel} ${item.message} ${lvTargets}`.toLowerCase();
                        if (!unlockedTargets.includes(query)) return false;
                    } else {
                        if (!lvTargets.includes(query)) return false;
                    }
                }

                return true;
            });

            const sortBy = dexSortByEl.value;
            const dir = sortOrder === "asc" ? 1 : -1;

            filtered.sort((a, b) => {
                const countA = drawCounts[String(a.lv)] || 0n;
                const countB = drawCounts[String(b.lv)] || 0n;
                const unlockedA = countA > 0n;
                const unlockedB = countB > 0n;

                if (sortBy === "lv") {
                    return (a.lv - b.lv) * dir;
                }

                if (unlockedA !== unlockedB) {
                    return unlockedA ? -1 : 1;
                }
                if (!unlockedA && !unlockedB) {
                    return b.lv - a.lv;
                }

                if (sortBy === "name") {
                    const cmp = a.reading.localeCompare(b.reading, "ja");
                    if (cmp !== 0) return cmp * dir;
                    return b.lv - a.lv;
                }

                if (sortBy === "dup") {
                    const dupA = countA - 1n;
                    const dupB = countB - 1n;
                    if (dupA !== dupB) return (dupA > dupB ? 1 : -1) * dir;
                    return b.lv - a.lv;
                }

                return 0;
            });

            currentFilteredList = filtered;
            matchCountEl.textContent = isFiltered ? `表示: ${filtered.length}件` : "";

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="dex-empty-msg">条件に一致するおみくじはありません</div>`;
                return;
            }

            filtered.forEach(item => {
                const count = drawCounts[String(item.lv)] || 0n;
                const isUnlocked = count > 0n;
                const dup = count - 1n;

                const div = document.createElement("div");
                div.dataset.lv = item.lv;
                div.className = "dex-item" + (isUnlocked ? "" : " locked") + (selectedLv === item.lv ? " selected" : "");

                if (isUnlocked) {
                    const dupHtml = dup > 0n ? `<span class="dex-dup" title="+${formatCommaBigInt(dup)}">+${formatCompactBigInt(dup)}</span>` : "";
                    div.innerHTML = `
                        <div class="dex-top">
                            <span class="dex-lv">Lv.${item.lv}</span>
                            ${dupHtml}
                        </div>
                        <div class="dex-reading">${item.reading}</div>
                        <div class="dex-name">${item.name}</div>
                        <div class="zone-tag ${item.class}" style="font-size: 0.58rem; padding: 0.1rem 0.4rem; margin-top: 0.3rem;">${item.zoneShortLabel}</div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="dex-top">
                            <span class="dex-lv">Lv.${item.lv}</span>
                        </div>
                        <div class="dex-name">？？？</div>
                    `;
                }

                div.addEventListener("click", () => handleDexItemClick(item, div));
                grid.appendChild(div);
            });
        }

        function openDex() {
            closeDexDetail();
            resetDexFilters();
            updateDexStatsBar();
            document.getElementById("dexModal").classList.add("open");
        }

        function closeDex() {
            dexZoomOverlayEl.classList.remove("open");
            document.getElementById("dexModal").classList.remove("open");
            resetConfirmButton();
        }

        function handleModalClick(e) {
            if (e.target.id === "dexModal") closeDex();
        }

        function resetCollection() {
            const btn = document.getElementById("resetBtn");
            if (btn.dataset.confirm !== "true") {
                btn.dataset.confirm = "true";
                btn.textContent = "本当に消す？";
                resetConfirmTimer = setTimeout(resetConfirmButton, 3000);
                return;
            }
            drawCounts = {};
            try { localStorage.removeItem(LEGACY_STORAGE_KEY); } catch {}
            saveCollection();
            resetConfirmButton();
            openDex();
        }

        function resetConfirmButton() {
            const btn = document.getElementById("resetBtn");
            btn.dataset.confirm = "false";
            btn.textContent = "記録リセット";
            if (resetConfirmTimer) {
                clearTimeout(resetConfirmTimer);
                resetConfirmTimer = null;
            }
        }

        // 初期化
        skipToggleEl.checked = isSkipMode;
        updateControlLabels();
        updateCountDisplay();
    </script>
</body>
</html>
